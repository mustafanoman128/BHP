server {
    listen 80;
    server_name _;

    root /home/ubuntu/BHP/Client;
    index app.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /predict_home_price {
        include proxy_params;
        proxy_pass http://127.0.0.1:5000;
    }

    location /get_location_names {
        include proxy_params;
        proxy_pass http://127.0.0.1:5000;
    }
}
